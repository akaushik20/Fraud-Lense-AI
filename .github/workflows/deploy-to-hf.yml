name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean Space snapshot
        run: |
          mkdir /tmp/space
          rsync -av \
            --exclude 'myenv' \
            --exclude '.venv' \
            --exclude 'data' \
            --exclude 'notes' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '__pycache__' \
            ./ /tmp/space/

          cat > /tmp/space/README.md <<'EOF'
          ---
          title: Fraud Lense AI
          emoji: 🕵️
          colorFrom: blue
          colorTo: purple
          sdk: gradio
          sdk_version: "6.19.0"
          app_file: app.py
          pinned: false
          ---
          EOF
          cat README.md >> /tmp/space/README.md

      - name: Upload snapshot to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q -U huggingface_hub
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              folder_path="/tmp/space",
              repo_id="SQLQueen/fraud-lense-ai",
              repo_type="space",
          )
          EOF